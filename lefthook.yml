# lefthook (evilmartians/lefthook): chạy kiểm tra nhanh trước mỗi commit, trên đúng file đã stage.
# Cài một lần: brew install lefthook swiftlint && lefthook install
pre-commit:
  parallel: true
  commands:
    swift-format:
      glob: "*.swift"
      run: swift format lint --strict {staged_files}
    swiftlint:
      glob: "*.swift"
      run: swiftlint lint --strict --quiet --force-exclude {staged_files}
    boundaries:
      glob: "*.swift"
      run: bash scripts/check-core-imports.sh
    schema-copy:
      glob: "{schema/*.sql,Packages/LifeOSData/Sources/Persistence/Migrations/sql/*.sql}"
      run: diff -r schema Packages/LifeOSData/Sources/Persistence/Migrations/sql
    tokens:
      glob: "design/tokens/*"
      run: python3 -I design/tokens/generate.py --check
    structure:
      run: python3 -I scripts/check_structure.py
    inventory:
      glob: "Packages/**/*.swift"
      run: python3 -I scripts/inventory.py --check
    plan:
      glob: "docs/plan/issues/*.md"
      run: python3 -I scripts/plan_graph.py --check
commit-msg:
  commands:
    conventional:
      run: |
        grep -qE '^(feat|fix|chore|docs|refactor|perf|test|build|ci)(\([a-z0-9-]+\))?!?: .+' {1} || { echo "Commit phải dạng type(scope): mô tả (LOS-xxx), xem conventions.md"; exit 1; }
